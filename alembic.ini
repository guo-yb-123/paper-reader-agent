# ============================================================
# Alembic 数据库迁移配置
# ============================================================

[alembic]
# 迁移脚本目录
script_location = migrations

# SQLAlchemy 连接 URL（通过环境变量注入，不硬编码）
# 实际值在 env.py 中从 app.core.config.settings 读取
sqlalchemy.url = postgresql://paper_reader:paper_reader_pass@localhost:5432/paper_reader_db

# 日志配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
